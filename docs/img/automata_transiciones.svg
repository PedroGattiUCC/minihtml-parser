<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%" style="background-color: #ffffff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Title / Encabezado -->
  <rect x="30" y="18" width="920" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="490" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">AFPN-λ: Diagrama de Transición de Estados (M)</text>
  <text x="490" y="60" text-anchor="middle" font-size="12" fill="#64748b">Notación: entrada, tope_pila / nuevo_tope (Clase 8, pág. 6) | X ∈ Γ = {Z₀, B, I, P}</text>

  <!-- Flecha de Inicio -->
  <line x1="60" y1="255" x2="168" y2="255" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-black)" />
  <text x="110" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Inicio</text>
  <text x="110" y="276" text-anchor="middle" font-size="12" fill="#64748b">Pila: [Z₀]</text>

  <!-- Bucle superior (Lectura & Push) -->
  <path d="M 195 212 C 160 110, 275 110, 240 210" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />

  <!-- Tarjeta de transiciones Lectura & Push -->
  <rect x="260" y="92" width="355" height="84" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)" />
  <text x="275" y="114" font-size="12" font-weight="700" fill="#1e40af">LECTURA (NO-OP) y APERTURA (PUSH):</text>
  <text x="275" y="133" font-size="12" fill="#1e3a8a">• TEXTO, X / X  <tspan fill="#64748b" font-size="11">(no altera la pila)</tspan></text>
  <text x="275" y="152" font-size="12" fill="#1e3a8a">• &lt;b&gt;, X / BX  |  &lt;i&gt;, X / IX  |  &lt;p&gt;, X / PX</text>
  <text x="275" y="167" font-size="11" font-style="italic" fill="#3b82f6">(apila marcador sobre el tope X actual)</text>

  <!-- Bucle inferior (Cierres & Pop) -->
  <path d="M 240 300 C 275 400, 160 400, 195 302" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />

  <!-- Tarjeta de transiciones Cierre & Pop -->
  <rect x="260" y="336" width="355" height="78" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)" />
  <text x="275" y="358" font-size="12" font-weight="700" fill="#991b1b">CIERRE CORRECTO (POP / Balanceo):</text>
  <text x="275" y="378" font-size="12" fill="#7f1d1d">• &lt;/b&gt;, B / λ   <tspan fill="#64748b" font-size="11">(desapila B si está en el tope)</tspan></text>
  <text x="275" y="398" font-size="12" fill="#7f1d1d">• &lt;/i&gt;, I / λ   |   &lt;/p&gt;, P / λ</text>

  <!-- Estado q0 (Círculo) -->
  <g filter="url(#shadow)">
    <circle cx="220" cy="255" r="48" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    <text x="220" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">q<tspan font-size="16" dy="5">0</tspan></text>
  </g>

  <!-- Transición q0 -> qf (Flecha verde horizontal) -->
  <line x1="270" y1="255" x2="708" y2="255" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <!-- Etiqueta sobre la transición espontánea -->
  <rect x="435" y="228" width="210" height="54" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="540" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">λ, Z₀ / Z₀</text>
  <text x="540" y="270" text-anchor="middle" font-size="11" fill="#166534">Transición espontánea</text>

  <!-- Estado qf (Doble Círculo - Aceptación) -->
  <g filter="url(#shadow)">
    <circle cx="770" cy="255" r="48" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    <circle cx="770" cy="255" r="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
    <text x="770" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">q<tspan font-size="16" dy="5">f</tspan></text>
  </g>
  <text x="770" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Estado Final (F)</text>
  <text x="770" y="338" text-anchor="middle" font-size="11" fill="#64748b">Aceptación por L(M)</text>

</svg>